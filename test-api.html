<!DOCTYPE html>
<html>
<head>
    <title>API Endpoint Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .endpoint { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>API Endpoint Test</h1>
    <p>Testing Vercel Python serverless functions...</p>
    
    <div class="endpoint">
        <h3>Health Endpoint</h3>
        <button onclick="testHealth()">Test /api/health</button>
        <div id="health-result"></div>
    </div>
    
    <div class="endpoint">
        <h3>Process Doc Endpoint</h3>
        <button onclick="testProcessDoc()">Test /api/process-doc</button>
        <div id="process-doc-result"></div>
    </div>
    
    <div class="endpoint">
        <h3>Generate Template Endpoint</h3>
        <button onclick="testGenerateTemplate()">Test /api/generate-template</button>
        <div id="generate-template-result"></div>
    </div>
    
    <script>
        async function testHealth() {
            const result = document.getElementById('health-result');
            result.innerHTML = 'Testing...';
            try {
                const response = await fetch('/api/health');
                const text = await response.text();
                result.innerHTML = `<strong>Status:</strong> ${response.status}<br><strong>Response:</strong> <pre>${text}</pre>`;
                result.className = response.ok ? 'success' : 'error';
            } catch (error) {
                result.innerHTML = `<strong>Error:</strong> ${error.message}`;
                result.className = 'error';
            }
        }
        
        async function testProcessDoc() {
            const result = document.getElementById('process-doc-result');
            result.innerHTML = 'Testing...';
            try {
                const response = await fetch('/api/process-doc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileData: 'test', fileName: 'test.docx' })
                });
                const text = await response.text();
                result.innerHTML = `<strong>Status:</strong> ${response.status}<br><strong>Response:</strong> <pre>${text.substring(0, 500)}</pre>`;
                result.className = response.ok ? 'success' : 'error';
            } catch (error) {
                result.innerHTML = `<strong>Error:</strong> ${error.message}`;
                result.className = 'error';
            }
        }
        
        async function testGenerateTemplate() {
            const result = document.getElementById('generate-template-result');
            result.innerHTML = 'Testing...';
            try {
                const response = await fetch('/api/generate-template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ir: { blocks: [] } })
                });
                const text = await response.text();
                result.innerHTML = `<strong>Status:</strong> ${response.status}<br><strong>Response:</strong> <pre>${text.substring(0, 500)}</pre>`;
                result.className = response.ok ? 'success' : 'error';
            } catch (error) {
                result.innerHTML = `<strong>Error:</strong> ${error.message}`;
                result.className = 'error';
            }
        }
    </script>
</body>
</html>
